name: Kernel, runtime and device conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup target add ${{ matrix.target }} --toolchain 1.99.0
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
      - name: Dependency install
        run: npm ci
      - name: Build platform PWA
        run: |
          npm run build
          npm run build:preview
      - name: Rust authority checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Runtime and controller checks
        run: |
          npm test
          python3 -m unittest discover -s tests -v
      - name: Browser privacy and approval checks
        run: |
          npx playwright install --with-deps chromium
          cargo build --locked --workspace
          python3 scripts/browser_smoke.py
          npm run test:platform
          node tests/resident-agent.mjs
          node tests/platform-browser.mjs
          node tests/preview-browser.mjs
      - name: Static phone host
        # A real native desktop fixture supplements the driver contract tests.
        env:
          CC: musl-gcc
        run: |
          target_key=$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')
          export "CARGO_TARGET_${target_key}_LINKER=musl-gcc"
          cargo build --locked --release --target ${{ matrix.target }} -j 2
      - name: Native computer use through Vercel driver
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get install -y xvfb openbox at-spi2-core dbus-x11
          bash scripts/qualify_desktop.sh
      - name: Real-process stress on native architecture
        run: python3 scripts/stress.py --binary target/${{ matrix.target }}/release/aksarad --documents 200
      - name: Protected backend operational checks
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          mkdir -p dist/test-host .aksara/test-host
          cp target/${{ matrix.target }}/release/aksarad dist/test-host/aksarad
          python3 -c "import secrets; from pathlib import Path; Path('.aksara/test-host/password').write_text(secrets.token_urlsafe(40))"
          sudo chown 1000:"$(id -g)" .aksara/test-host/password
          sudo chmod 640 .aksara/test-host/password
          trap 'docker rm -f aksara-ops-test >/dev/null 2>&1 || true; docker volume rm aksara-ops-test-state >/dev/null 2>&1 || true' EXIT
          docker build -f deploy/test-host/Dockerfile -t aksara-test-host:local .
          docker volume create aksara-ops-test-state
          docker run -d --name aksara-ops-test --memory 768m --cpus 1 --security-opt no-new-privileges --cap-drop ALL -p 127.0.0.1:18080:8080 -v aksara-ops-test-state:/data --mount type=bind,src="$PWD/.aksara/test-host/password",dst=/run/secrets/aksara-test-password,readonly -e AKSARA_PUBLIC_ORIGIN=http://127.0.0.1:18080 aksara-test-host:local
          node tests/test-host-ops.mjs
          docker build -f deploy/computer/Dockerfile -t aksara-computer:local deploy/computer
          AKSARA_DOCKER_TEST_IMAGE=$(docker image inspect aksara-computer:local --format '{{.Id}}') node --test packages/gateway/computer.test.mjs
      - name: Package with dependency notices
        run: |
          python3 scripts/package_release.py --binary target/${{ matrix.target }}/release/aksarad --target ${{ matrix.target }}
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aksara-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            stress-results.json
          retention-days: 30
